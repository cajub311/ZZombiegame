<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>FACTION WARS — conquer the map</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%94%EF%B8%8F%3C/text%3E%3C/svg%3E" />
<meta name="theme-color" content="#06120a" />
<link rel="manifest" href="manifest.json" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
  :root { --ink:#dffbe6; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05100a; }
  body {
    font-family: "Trebuchet MS", system-ui, sans-serif; color: var(--ink);
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #game { position: fixed; inset: 0; display: block; }

  .overlay {
    position: fixed; inset: 0; z-index: 20; overflow-y: auto;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px 16px;
    background: radial-gradient(circle at 50% 30%, rgba(20,50,30,0.6), rgba(3,8,5,0.96) 70%);
  }
  .overlay.hidden { display: none; }
  h1 { font-size: clamp(34px, 8vw, 70px); font-weight: 900; letter-spacing: 2px; margin: 0 0 2px;
       color: #8dff7a; text-shadow: 0 0 24px rgba(109,255,91,0.5), 0 5px 0 #0a2e0a; }
  .sub { color: #87c79a; letter-spacing: 4px; text-transform: uppercase; font-size: 13px; margin-bottom: 18px; }

  .cards { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; max-width: 760px; margin: 8px 0 20px; }
  .card {
    width: 168px; padding: 16px 14px; border-radius: 16px; cursor: pointer;
    background: rgba(255,255,255,0.03); border: 2px solid rgba(255,255,255,0.12);
    transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease;
  }
  .card:hover { transform: translateY(-4px); }
  .card .ico { font-size: 40px; line-height: 1; }
  .card .nm { font-weight: 900; font-size: 18px; margin: 6px 0 4px; letter-spacing: 1px; }
  .card .bl { font-size: 12px; color: #b7d8c0; line-height: 1.35; min-height: 50px; }
  .card.sel { box-shadow: 0 0 0 3px rgba(255,255,255,0.15), 0 14px 36px rgba(0,0,0,0.45); }

  .btn {
    margin-top: 4px; padding: 15px 40px; font-size: 19px; font-weight: 900; letter-spacing: 2px;
    border: none; border-radius: 999px; cursor: pointer; color: #06210a;
    background: linear-gradient(180deg, #9dff7a, #46c23a);
    box-shadow: 0 9px 0 #1c5a14, 0 14px 26px rgba(109,255,91,0.3);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .btn:active { transform: translateY(7px); box-shadow: 0 2px 0 #1c5a14; }
  .btn.alt { background: linear-gradient(180deg,#cfe9ff,#5aa9ff); box-shadow: 0 9px 0 #1c4a7a, 0 14px 26px rgba(90,169,255,0.3); }
  .btn.alt:active { box-shadow: 0 2px 0 #1c4a7a; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .hint { margin-top: 18px; font-size: 13px; color: #8fb89a; max-width: 520px; line-height: 1.5; }
  .verdict { font-size: clamp(40px,10vw,84px); font-weight: 900; letter-spacing: 3px; margin: 0; }
  .verdict.win { color: #8dff7a; text-shadow: 0 0 26px rgba(109,255,91,0.6); }
  .verdict.lose { color: #ff5a6a; text-shadow: 0 0 26px rgba(255,90,106,0.6); }

  #hud {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10; pointer-events: none;
    display: flex; align-items: center; gap: 10px; padding: 8px 12px;
    font-weight: 800; font-size: 14px;
    background: linear-gradient(180deg, rgba(4,12,8,0.82), rgba(4,12,8,0));
  }
  #hud .me { display: flex; align-items: center; gap: 6px; }
  #tally { display: flex; gap: 8px; margin: 0 auto; flex-wrap: wrap; justify-content: center; }
  #tally .chip { display: flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px;
                 background: rgba(0,0,0,0.35); font-size: 13px; }
  #battle { font-size: 13px; color: #cfe9d6; opacity: .9; }
  #moon { color: #ff6a4e; font-weight: 900; font-size: 13px; min-width: 70px; text-align: right; }

  #ratios {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 16px; z-index: 10;
    display: flex; gap: 8px; padding: 7px 9px; border-radius: 14px;
    background: rgba(6,16,10,0.78); border: 1px solid rgba(255,255,255,0.08);
  }
  #ratios.hidden { display: none; }
  #ratios .lab { align-self: center; font-size: 11px; color: #8fb89a; letter-spacing: 1px; margin-right: 2px; }
  #ratios button {
    min-width: 50px; padding: 9px 4px; font-size: 15px; font-weight: 900; cursor: pointer;
    border-radius: 9px; border: 1px solid rgba(255,255,255,0.14); color: #cfe9d6;
    background: rgba(255,255,255,0.04); transition: all .1s ease;
  }
  #ratios button.on { color: #06210a; background: linear-gradient(180deg,#9dff7a,#46c23a); border-color: transparent; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="me" id="meTag"></div>
  <div id="tally"></div>
  <div id="battle"></div>
  <div id="moon"></div>
</div>

<!-- Send-amount control: choose what fraction of a base's units to send -->
<div id="ratios" class="hidden">
  <span class="lab">SEND</span>
  <button data-r="0.25">25%</button>
  <button data-r="0.5">50%</button>
  <button data-r="0.75">75%</button>
  <button data-r="1">100%</button>
</div>

<!-- Faction select -->
<div id="menu" class="overlay">
  <h1>FACTION WARS</h1>
  <div class="sub">conquer every territory</div>
  <div class="cards" id="cards"></div>
  <button class="btn" id="startBtn">START BATTLE</button>
  <div class="hint">
    <b>Tap a base you own</b> to select it, then <b>tap a target</b> to send your units —
    or <b>drag</b> from your base to the target. Sending sends <b>everything</b>, so don't leave a
    base empty. Outnumber the defenders to capture. Wipe out the other factions to win.
  </div>
</div>

<!-- Win / lose -->
<div id="end" class="overlay hidden">
  <p class="verdict" id="verdict">VICTORY</p>
  <div class="sub" id="endSub"></div>
  <div class="row">
    <button class="btn" id="nextBtn">NEXT BATTLE</button>
    <button class="btn alt" id="menuBtn">CHANGE FACTION</button>
  </div>
</div>

<script>
(() => {
  "use strict";
  const TAU = Math.PI * 2;
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx*dx + dy*dy; };

  // ---------- factions (data-driven; add more by appending here) ----------
  const FACTIONS = {
    zombie:   { name:"Zombies",    color:"#6dff5b", dark:"#16341a", icon:"🧟",
                prod:1.0, cap:1.0, combat:1.05, speed:1.0, convert:0.55,
                blurb:"Infect the fallen — every conquest swells your horde." },
    werewolf: { name:"Werewolves", color:"#ff6a4e", dark:"#3a1810", icon:"🐺",
                prod:1.0,  cap:0.95, combat:1.3, speed:1.4,
                blurb:"Blood Moon frenzies: blazing-fast, savage raids." },
    human:    { name:"Humans",     color:"#5aa9ff", dark:"#13243a", icon:"🛡️",
                prod:1.18, cap:1.25, combat:1.0, speed:1.0, homeDef:1.2,
                blurb:"Out-produce and fortify. Drown them in numbers." },
    vampire:  { name:"Vampires",   color:"#c46bff", dark:"#2a1640", icon:"🦇",
                prod:0.95, cap:1.0, combat:1.1, speed:1.1, lifesteal:0.22, drain:0.6,
                blurb:"Lifesteal in battle and drain the lands. Win the long night." },
  };
  const FIDS = Object.keys(FACTIONS);
  const fcolor = o => o === "neutral" ? "#8a93a0" : FACTIONS[o].color;
  const fdark  = o => o === "neutral" ? "#24282e" : FACTIONS[o].dark;
  // combat / speed multipliers (werewolf surges during a Blood Moon)
  const cmult = o => o === "neutral" ? 1 : (o === "werewolf" ? (state.bloodMoon > 0 ? 1.75 : 1.3) : FACTIONS[o].combat);
  const smult = o => o === "neutral" ? 1 : (o === "werewolf" && state.bloodMoon > 0 ? 1.95 : FACTIONS[o].speed);

  // ---------- canvas ----------
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);
  if (window.visualViewport) window.visualViewport.addEventListener("resize", resize);
  resize();

  // ---------- sound (procedural, no assets) ----------
  const AudioFX = (() => {
    let ac = null, muted = false;
    const get = () => ac || (ac = new (window.AudioContext || window.webkitAudioContext)());
    function tone(freq, dur, type, vol, slideTo) {
      if (muted) return;
      const a = get(); if (!a) return;
      const o = a.createOscillator(), g = a.createGain();
      o.type = type || "sine"; o.frequency.value = freq;
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, a.currentTime + dur);
      g.gain.value = vol || 0.12;
      g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
      o.connect(g); g.connect(a.destination);
      o.start(); o.stop(a.currentTime + dur);
    }
    return {
      resume() { const a = get(); if (a && a.state === "suspended") a.resume(); },
      mute() { muted = !muted; return muted; },
      send()    { tone(320, 0.12, "triangle", 0.10, 200); },
      take()    { tone(180, 0.11, "sawtooth", 0.14, 90); tone(520, 0.18, "sine", 0.10, 760); },
      lose()    { tone(300, 0.2, "sawtooth", 0.12, 70); },
      moon()    { tone(70, 0.6, "sawtooth", 0.16, 130); tone(140, 0.5, "sine", 0.08, 90); },
      win()     { [523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,0.3,"triangle",0.14),i*120)); },
      fail()    { [392,330,262,196].forEach((f,i)=>setTimeout(()=>tone(f,0.32,"sawtooth",0.13),i*150)); },
    };
  })();

  // ---------- state ----------
  const state = {
    phase: "menu", player: "zombie", battle: 1, time: 0,
    bloodMoon: 0, bloodMoonCd: 26, winner: null, sendRatio: 0.5,
  };
  let nodes = [], streams = [], particles = [], floats = [], links = [];
  let selected = new Set(), dragFrom = null, pointer = null, hoverNode = null;
  const ai = {};   // faction -> {next}

  // ---------- juice ----------
  function burst(x, y, color, n) {
    for (let i = 0; i < (n || 10); i++) {
      const a = rand(0, TAU), s = rand(40, 170);
      particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: rand(0.3,0.7), max: 0.7, r: rand(2,4), color });
    }
    if (particles.length > 400) particles.splice(0, 40);
  }
  function ring(x, y, R, color) { particles.push({ x, y, r: 8, R, life: 0.5, max: 0.5, color, ring: true }); }
  function addFloat(x, y, text, color, size) { floats.push({ x, y, text, color, size: size || 16, life: 1.0 }); if (floats.length > 30) floats.shift(); }
  let toastMsg = null, toastT = 0;
  function toast(m) { toastMsg = m; toastT = 2.4; }

  // ---------- map ----------
  function mkNode(x, y, r, owner, units) {
    return { x, y, r, owner, units, cap: Math.round(r * 1.5), prod: r * 0.032 };
  }
  function genMap(battle) {
    nodes = []; streams = []; particles = []; floats = []; selected.clear(); dragFrom = null;
    const top = 96, count = clamp(9 + battle, 9, 18);
    const corners = [
      { x: 120, y: top + 70 }, { x: W - 120, y: H - 110 },
      { x: W - 120, y: top + 70 }, { x: 120, y: H - 110 },
    ];
    // player always takes the first corner; rivals fill the rest (shuffled)
    const rivals = FIDS.filter(f => f !== state.player);
    for (let i = rivals.length - 1; i > 0; i--) { const j = (Math.random()*(i+1))|0; [rivals[i],rivals[j]]=[rivals[j],rivals[i]]; }
    const order = [state.player, ...rivals];
    order.forEach((f, i) => { const c = corners[i % corners.length]; nodes.push(mkNode(c.x, c.y, 33, f, 16)); });
    // neutral territories
    let tries = 0;
    while (nodes.length < count && tries < 800) {
      tries++;
      const r = rand(19, 31), x = rand(70, W - 70), y = rand(top + 40, H - 80);
      if (nodes.every(n => dist2(n.x, n.y, x, y) > (n.r + r + 66) * (n.r + r + 66)))
        nodes.push(mkNode(x, y, r, "neutral", Math.round(rand(6, 14))));
    }
    // cosmetic links: connect each node to its ~2 nearest neighbours
    links = [];
    nodes.forEach((n, i) => {
      const near = nodes.map((m, j) => ({ j, d: dist2(n.x, n.y, m.x, m.y) }))
        .filter(o => o.j !== i).sort((a, b) => a.d - b.d).slice(0, 2);
      near.forEach(o => { if (o.j > i) links.push([i, o.j]); });
    });
    FIDS.forEach(f => ai[f] = { next: rand(0.5, 1.5) });
    state.time = 0; state.bloodMoon = 0; state.bloodMoonCd = 24; state.winner = null;
  }

  // ---------- sending / combat ----------
  function sendFrom(sources, target, ratio) {
    ratio = ratio == null ? 1 : ratio;
    let sent = 0;
    for (const s of sources) {
      const units = Math.floor(s.units * ratio);
      if (units < 1 || s === target) continue;
      s.units -= units;
      streams.push({ owner: s.owner, units, x: s.x, y: s.y, node: target, speed: 165 });
      sent++;
    }
    if (sent && sources[0] && sources[0].owner === state.player) AudioFX.send();
  }
  function resolve(s) {
    const node = s.node; if (!node) return;
    if (node.owner === s.owner) { node.units += s.units; return; }
    const atk = s.units * cmult(s.owner);
    const def = node.units * cmult(node.owner) * ((node.owner !== "neutral" && FACTIONS[node.owner].homeDef) || 1);
    if (atk > def) {
      const killed = node.units, prev = node.owner;
      let rem = (atk - def) / cmult(s.owner);
      const F = FACTIONS[s.owner];
      if (F.convert) rem += killed * F.convert;       // zombies: the fallen rise
      else if (F.lifesteal) rem += killed * F.lifesteal; // vampires: drink the kill
      node.owner = s.owner; node.units = Math.max(1, rem);
      burst(node.x, node.y, F.color, 16); ring(node.x, node.y, node.r + 26, F.color);
      if (s.owner === state.player || prev === state.player) {
        AudioFX.take(); addFloat(node.x, node.y - node.r - 8, s.owner === state.player ? "TAKEN" : "LOST", F.color, 16);
        if (prev === state.player) AudioFX.lose();
      }
    } else {
      node.units = (def - atk) / (cmult(node.owner) * ((node.owner !== "neutral" && FACTIONS[node.owner].homeDef) || 1));
      burst(s.x, s.y, fcolor(s.owner), 6);
    }
  }

  // ---------- AI ----------
  function aiThink(fid) {
    const mine = nodes.filter(n => n.owner === fid);
    if (!mine.length) return;
    const aggro = 1 + state.battle * 0.08;
    const source = mine.slice().sort((a, b) => b.units - a.units)[0];
    if (!source || source.units < 8) return;          // wait until a node has an army
    let best = null, bestScore = 0;
    for (const t of nodes) {
      if (t.owner === fid) continue;
      const myEff = source.units * cmult(fid);
      const tEff = t.units * cmult(t.owner) * ((t.owner !== "neutral" && FACTIONS[t.owner].homeDef) || 1);
      const d = Math.sqrt(dist2(source.x, source.y, t.x, t.y));
      let score = -d * 0.16;
      if (myEff > tEff * 1.04) {
        // outright capture — strongly preferred
        score += 60 + (t.owner === "neutral" ? 16 * aggro : 10 * aggro) - t.units * 0.3;
      } else {
        // can't solo it — SIEGE: chip the weakest enemy node so multiple waves
        // eventually crack a fortress (prevents stalemates; lets an idle player lose).
        if (t.owner === "neutral") continue;           // don't waste units sieging neutrals
        if (source.units < source.cap * 0.55) continue; // only siege from a near-full node
        score += 8 * aggro - t.units * 0.5;
        if (t.owner === state.player) score += 5 * aggro; // gang the leader
      }
      if (score > bestScore) { bestScore = score; best = t; }
    }
    if (best) sendFrom([source], best);
  }

  // ---------- update ----------
  function update(dt) {
    state.time += dt;
    // blood moon cycle (global werewolf surge)
    state.bloodMoonCd -= dt;
    if (state.bloodMoon > 0) { state.bloodMoon -= dt; if (state.bloodMoon <= 0) toast("the moon sets"); }
    else if (state.bloodMoonCd <= 0) { state.bloodMoon = 7; state.bloodMoonCd = 26; toast("🌕 BLOOD MOON — werewolves surge"); AudioFX.moon(); }

    // production + vampire drain. A slow global escalation makes late armies
    // bigger so fortress standoffs always break — battles can't stalemate.
    const escalate = 1 + state.time * 0.01;   // mild — keeps armies flowing in the late game
    for (const n of nodes) {
      if (n.owner === "neutral") continue;
      const cap = n.cap * FACTIONS[n.owner].cap;
      if (n.units < cap) n.units = Math.min(cap, n.units + n.prod * FACTIONS[n.owner].prod * escalate * dt);
      if (FACTIONS[n.owner].drain) {
        for (const o of nodes) {
          if (o === n || o.owner === "neutral" || o.owner === n.owner) continue;
          if (o.units > 1 && dist2(n.x, n.y, o.x, o.y) < 250 * 250) {
            const amt = Math.min(o.units - 0.5, FACTIONS[n.owner].drain * dt);
            o.units -= amt; n.units += amt;
            if (Math.random() < 0.12) burst((n.x+o.x)/2, (n.y+o.y)/2, FACTIONS[n.owner].color, 1);
          }
        }
      }
    }

    // AI
    for (const f of FIDS) {
      if (f === state.player) continue;
      ai[f].next -= dt;
      if (ai[f].next <= 0) { ai[f].next = rand(0.7, 1.6) / (1 + state.battle * 0.06); aiThink(f); }
    }

    // streams
    for (const s of streams) {
      const node = s.node; if (!node) { s.dead = true; continue; }
      const dx = node.x - s.x, dy = node.y - s.y, d = Math.hypot(dx, dy) || 1;
      const sp = s.speed * smult(s.owner);
      if (d <= node.r + sp * dt) { resolve(s); s.dead = true; }
      else { s.x += dx / d * sp * dt; s.y += dy / d * sp * dt; }
    }
    streams = streams.filter(s => !s.dead);

    // particles / floats
    for (const p of particles) {
      p.life -= dt;
      if (p.ring) { p.r += (p.R - p.r) * Math.min(1, dt * 8); }
      else { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.9; p.vy *= 0.9; }
    }
    particles = particles.filter(p => p.life > 0);
    for (const f of floats) { f.life -= dt; f.y -= 22 * dt; }
    floats = floats.filter(f => f.life > 0);
    if (toastT > 0) toastT -= dt;

    // win / lose
    const present = {};
    for (const n of nodes) if (n.owner !== "neutral") present[n.owner] = true;
    for (const s of streams) present[s.owner] = true;
    const alive = FIDS.filter(f => present[f]);
    if (!present[state.player]) endBattle(false);
    else if (alive.length === 1 && alive[0] === state.player) endBattle(true);
    else if (state.time > 150) {                 // hard backstop: no battle drags forever
      const counts = {}; FIDS.forEach(f => counts[f] = 0);
      for (const n of nodes) if (n.owner !== "neutral") counts[n.owner]++;
      const top = FIDS.slice().sort((a, b) => counts[b] - counts[a])[0];
      endBattle(top === state.player && counts[state.player] > 0);
    }
  }

  // ---------- render ----------
  function render() {
    ctx.clearRect(0, 0, W, H);
    // background
    ctx.fillStyle = "#06110b"; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = "rgba(80,120,90,0.06)"; ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 60) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y < H; y += 60) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

    // links
    ctx.strokeStyle = "rgba(140,160,150,0.07)"; ctx.lineWidth = 2;
    for (const [a, b] of links) { ctx.beginPath(); ctx.moveTo(nodes[a].x, nodes[a].y); ctx.lineTo(nodes[b].x, nodes[b].y); ctx.stroke(); }

    // drag line
    if (dragFrom && pointer) {
      ctx.strokeStyle = fcolor(dragFrom.owner); ctx.lineWidth = 3; ctx.setLineDash([6, 8]);
      ctx.beginPath(); ctx.moveTo(dragFrom.x, dragFrom.y); ctx.lineTo(pointer.x, pointer.y); ctx.stroke();
      ctx.setLineDash([]);
    }

    // nodes
    for (const n of nodes) {
      const col = fcolor(n.owner), sel = selected.has(n);
      ctx.fillStyle = "rgba(0,0,0,0.35)";
      ctx.beginPath(); ctx.ellipse(n.x, n.y + n.r * 0.5, n.r * 0.95, n.r * 0.34, 0, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, TAU);
      ctx.fillStyle = fdark(n.owner); ctx.fill();
      ctx.lineWidth = sel ? 5 : 3; ctx.strokeStyle = col;
      if (sel || n === hoverNode) { ctx.shadowColor = col; ctx.shadowBlur = 16; }
      ctx.stroke(); ctx.shadowBlur = 0;
      if (sel) { ctx.lineWidth = 2; ctx.strokeStyle = "rgba(255,255,255,0.8)";
        ctx.beginPath(); ctx.arc(n.x, n.y, n.r + 5 + Math.sin(state.time*6)*1.5, 0, TAU); ctx.stroke(); }
      ctx.fillStyle = "#fff"; ctx.font = `900 ${Math.round(n.r*0.85)}px system-ui, sans-serif`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(Math.floor(n.units), n.x, n.y + 1);
    }

    // streams
    for (const s of streams) {
      const col = fcolor(s.owner);
      ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.arc(s.x, s.y, 8, 0, TAU); ctx.fill(); ctx.shadowBlur = 0;
      ctx.fillStyle = "#06110b"; ctx.font = "900 11px system-ui, sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(s.units, s.x, s.y + 0.5);
    }

    // particles
    for (const p of particles) {
      const a = clamp(p.life / p.max, 0, 1);
      ctx.globalAlpha = a;
      if (p.ring) { ctx.strokeStyle = p.color; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.stroke(); }
      else { ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill(); }
    }
    ctx.globalAlpha = 1;

    // floats
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (const f of floats) {
      ctx.globalAlpha = clamp(f.life, 0, 1);
      ctx.fillStyle = f.color; ctx.font = `900 ${f.size}px system-ui, sans-serif`;
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;

    // blood-moon wash
    if (state.bloodMoon > 0) {
      const pulse = 0.10 + 0.05 * Math.sin(state.time * 5);
      const g = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.2, W/2, H/2, Math.max(W,H)*0.8);
      g.addColorStop(0, "rgba(120,0,0,0)"); g.addColorStop(1, `rgba(160,14,14,${pulse})`);
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }

    // toast
    if (toastT > 0) {
      ctx.globalAlpha = clamp(toastT, 0, 1);
      ctx.fillStyle = "rgba(0,0,0,0.55)"; const tw = 360;
      ctx.fillRect(W/2 - tw/2, 64, tw, 34);
      ctx.fillStyle = "#dffbe6"; ctx.font = "800 15px system-ui, sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(toastMsg, W/2, 81);
      ctx.globalAlpha = 1;
    }

    updateHud();
  }

  function updateHud() {
    const meTag = document.getElementById("meTag");
    const F = FACTIONS[state.player];
    meTag.innerHTML = `<span style="font-size:18px">${F.icon}</span><span style="color:${F.color}">${F.name}</span>`;
    const counts = {}; FIDS.forEach(f => counts[f] = 0);
    let neutral = 0;
    for (const n of nodes) { if (n.owner === "neutral") neutral++; else counts[n.owner]++; }
    const tally = document.getElementById("tally");
    tally.innerHTML = FIDS.map(f =>
      `<span class="chip" style="color:${FACTIONS[f].color};${f===state.player?'box-shadow:0 0 0 1px '+FACTIONS[f].color:''}">${FACTIONS[f].icon} ${counts[f]}</span>`
    ).join("");
    document.getElementById("battle").textContent = "BATTLE " + state.battle;
    document.getElementById("moon").textContent = state.bloodMoon > 0 ? "🌕 MOON " + Math.ceil(state.bloodMoon) : "";
  }

  // ---------- input ----------
  function nodeAt(x, y) {
    for (const n of nodes) if (dist2(n.x, n.y, x, y) < (n.r + 6) * (n.r + 6)) return n;
    return null;
  }
  function evPos(e) {
    const t = e.touches ? e.touches[0] : e;
    const r = canvas.getBoundingClientRect();
    return { x: (t.clientX - r.left), y: (t.clientY - r.top) };
  }
  function onDown(e) {
    if (state.phase !== "play") return;
    e.preventDefault(); AudioFX.resume();
    const p = evPos(e); pointer = p;
    const n = nodeAt(p.x, p.y);
    if (n && n.owner === state.player) { dragFrom = n; }          // potential drag-send
    else if (n && selected.size) { sendFrom([...selected], n, state.sendRatio); selected.clear(); } // send to enemy/neutral
    else { selected.clear(); }                                     // empty: deselect
  }
  function onMove(e) {
    if (state.phase !== "play") return;
    const p = evPos(e); pointer = p; hoverNode = nodeAt(p.x, p.y);
  }
  function onUp(e) {
    if (state.phase !== "play") return;
    e.preventDefault();
    const p = pointer ? pointer : evPos(e);
    const n = nodeAt(p.x, p.y);
    if (dragFrom) {
      if (n && n !== dragFrom) {
        const src = (selected.size && selected.has(dragFrom)) ? [...selected] : [dragFrom];
        sendFrom(src, n, state.sendRatio); selected.clear();
      } else if (n === dragFrom) {
        if (selected.has(n)) selected.delete(n); else selected.add(n);  // tap toggles select
      }
      dragFrom = null;
    }
    hoverNode = null;
  }
  canvas.addEventListener("mousedown", onDown);
  canvas.addEventListener("mousemove", onMove);
  window.addEventListener("mouseup", onUp);
  canvas.addEventListener("touchstart", onDown, { passive: false });
  canvas.addEventListener("touchmove", e => { if (e.touches[0]) { onMove(e); e.preventDefault(); } }, { passive: false });
  canvas.addEventListener("touchend", onUp, { passive: false });
  window.addEventListener("keydown", e => { if (e.key.toLowerCase() === "m") toast(AudioFX.mute() ? "🔇 muted" : "🔊 sound on"); });

  // ---------- flow ----------
  function startBattle() {
    document.getElementById("menu").classList.add("hidden");
    document.getElementById("end").classList.add("hidden");
    document.getElementById("ratios").classList.remove("hidden");
    genMap(state.battle);
    state.phase = "play";
  }
  function endBattle(win) {
    if (state.phase !== "play") return;
    state.phase = "over"; state.winner = win;
    document.getElementById("ratios").classList.add("hidden");
    const F = FACTIONS[state.player];
    const v = document.getElementById("verdict");
    v.textContent = win ? "VICTORY" : "DEFEAT";
    v.className = "verdict " + (win ? "win" : "lose");
    document.getElementById("endSub").textContent = win
      ? `${F.name} conquered the map — Battle ${state.battle} cleared`
      : `${F.name} were wiped out on Battle ${state.battle}`;
    document.getElementById("nextBtn").textContent = win ? "NEXT BATTLE" : "RETRY";
    document.getElementById("end").classList.remove("hidden");
    win ? AudioFX.win() : AudioFX.fail();
  }

  // faction cards
  const cardsEl = document.getElementById("cards");
  cardsEl.innerHTML = FIDS.map(f => {
    const F = FACTIONS[f];
    return `<div class="card" data-f="${f}" style="border-color:${F.color}55">
      <div class="ico">${F.icon}</div>
      <div class="nm" style="color:${F.color}">${F.name}</div>
      <div class="bl">${F.blurb}</div></div>`;
  }).join("");
  function selectCard(f) {
    state.player = f;
    [...cardsEl.children].forEach(c => {
      const on = c.dataset.f === f;
      c.classList.toggle("sel", on);
      c.style.borderColor = on ? FACTIONS[f].color : FACTIONS[c.dataset.f].color + "55";
    });
  }
  cardsEl.addEventListener("click", e => { const c = e.target.closest(".card"); if (c) { AudioFX.resume(); selectCard(c.dataset.f); } });
  selectCard("zombie");

  // send-ratio buttons
  const ratiosEl = document.getElementById("ratios");
  function setRatio(r) {
    state.sendRatio = r;
    [...ratiosEl.querySelectorAll("button")].forEach(b => b.classList.toggle("on", parseFloat(b.dataset.r) === r));
  }
  ratiosEl.addEventListener("click", e => { const b = e.target.closest("button"); if (b) { AudioFX.resume(); setRatio(parseFloat(b.dataset.r)); } });
  setRatio(0.5);

  document.getElementById("startBtn").addEventListener("click", () => { AudioFX.resume(); state.battle = 1; startBattle(); });
  document.getElementById("nextBtn").addEventListener("click", () => { AudioFX.resume(); if (state.winner) state.battle++; startBattle(); });
  document.getElementById("menuBtn").addEventListener("click", () => {
    document.getElementById("end").classList.add("hidden");
    document.getElementById("menu").classList.remove("hidden");
    state.phase = "menu";
  });

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    let dt = (now - last) / 1000; last = now;
    dt = Math.min(dt, 0.05);
    if (state.phase === "play") update(dt);
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  if ("serviceWorker" in navigator)
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
})();
</script>
</body>
</html>
